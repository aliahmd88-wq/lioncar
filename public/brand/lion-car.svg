				<h1 class="screen-reader-text">התחבר</h1>
			<div id="login">
		<h1 role="presentation" class="wp-login-logo"><a href="https://he.wordpress.org/">פועל על וורדפרס</a></h1>
	
		<form name="loginform" id="loginform" action="https://a-f.site/wp-login.php" method="post">
			<p>
				<label for="user_login">שם משתמש או כתובת אימייל</label>
				<input type="text" name="log" id="user_login" class="input ltr" value="" size="20" autocapitalize="off" autocomplete="username" required="required" />
			</p>

			<div class="user-pass-wrap">
				<label for="user_pass">סיסמה</label>
				<div class="wp-pwd">
					<input type="password" name="pwd" id="user_pass" class="input password-input ltr" value="" size="20" autocomplete="current-password" spellcheck="false" required="required" />
					<button type="button" class="button button-secondary wp-hide-pw hide-if-no-js" data-toggle="0" aria-label="הצג סיסמה">
						<span class="dashicons dashicons-visibility" aria-hidden="true"></span>
					</button>
				</div>
			</div>
									<p class="forgetmenot">
				<input name="rememberme" type="checkbox" id="rememberme" value="forever"  />
				<label for="rememberme">זכור אותי</label>
				<span class="wp-tooltip wp-is-toggletip">
				<button aria-haspopup="dialog" class="wp-tooltip__toggle" popovertarget="rememberme-help-toggletip" type="button" aria-label="עזרה"><span class="dashicons dashicons-editor-help" aria-hidden="true"></span></button>
				<span popover="auto" id="rememberme-help-toggletip" class="wp-tooltip__bubble" role="dialog" aria-label="עזרה" tabindex="-1" autofocus><span id="rememberme-help-toggletip-text" class="wp-tooltip__text">Selecting &quot;Remember Me&quot; increases the length of time until you&#8217;re asked to log in again on this device. To keep your account secure, use this option only on your personal devices.</span><button type="button" class="wp-tooltip__close" popovertarget="rememberme-help-toggletip" popovertargetaction="hide" aria-label="סגור"><span class="dashicons dashicons-no-alt" aria-hidden="true"></span></button></span></span>			</p>
			<p class="submit">
				<input type="submit" name="wp-submit" id="wp-submit" class="button button-primary button-large" value="התחבר" />
									<input type="hidden" name="redirect_to" value="https://a-f.site/wp-admin/" />
									<input type="hidden" name="testcookie" value="1" />
			</p>
		</form>

					<p id="nav">
				<a rel="nofollow" class="wp-login-register" href="https://a-f.site/wp-login.php?action=register">הרשמה</a> | <a class="wp-login-lost-password" href="https://a-f.site/wp-login.php?action=lostpassword">שחזור סיסמה</a>			</p>
			<script>
function wp_attempt_focus() {setTimeout( function() {try {d = document.getElementById( "user_login" );d.focus(); d.select();} catch( er ) {}}, 200);}
wp_attempt_focus();
if ( typeof wpOnload === 'function' ) { wpOnload() }
</script>
